<script>
window.claude=window.claude||{use:async()=>null};
const mem={},st={get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return mem[k]||null}},set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let users=st.get('du_users')||{},me=null,tab='home',authMode='login';
function fixUser(u){u.xp=u.xp||0;u.level=u.level||'Principiante';u.gw=u.gw||0;u.prog=Object.assign({Java:0,SQL:0,Python:0},u.prog||{});u.hist=(u.hist||[]).filter(h=>h&&h.k&&K[h.k]);return u}

const save=()=>{users[me.email]=me;st.set('du_users',users)};

// ---------- base de conocimiento de errores ----------
const K={
sc:{n:'Falta punto y coma',q:'El compilador no encontró el ";" que indica el final de la sentencia.',p:'En Java cada instrucción debe terminar con ";". Sin él, el compilador cree que la línea continúa y falla al leer la siguiente.',e:'int a = 5;   // correcto\nint b = 6    // ERROR: falta ;',v:'Al terminar de escribir una instrucción, pon el ";" de inmediato. Un IDE como IntelliJ o VS Code lo subraya en rojo.',s:'Es como el punto al final de una oración: sin él, el programa no sabe dónde termina tu idea.'},
asg:{n:'Asignación en vez de comparación',q:'Usaste "=" dentro de un if. "=" guarda un valor; no pregunta si algo es igual.',p:'El if necesita una condición (true/false). "x = 5" asigna 5 a x y no produce un booleano, por eso Java rechaza el código.',e:'if (x == 5) { ... }  // pregunta si x vale 5',v:'Lee "==" como "es igual a?" y "=" como "recibe el valor".',s:'Un signo = es "guarda esto", dos signos == es "¿son iguales?".'},
streq:{n:'Comparar Strings con ==',q:'"==" compara si dos variables apuntan al mismo objeto, no si tienen el mismo texto.',p:'Los Strings son objetos. Dos textos idénticos pueden vivir en lugares distintos de memoria y "==" daría false.',e:'String a = new String("hi");\nSystem.out.println(a == "hi");      // false\nSystem.out.println(a.equals("hi")); // true',v:'Para texto, usa siempre .equals() (o .equalsIgnoreCase()).',s:'== pregunta "¿es la misma hoja?"; equals pregunta "¿dice lo mismo?".'},
tipo:{n:'Tipos incompatibles',q:'Intentas guardar un valor de un tipo en una variable de otro tipo.',p:'Java es de tipado estático: cada variable acepta solo su tipo. Un int no guarda texto y un String necesita comillas.',e:'int edad = 20;\nString nombre = "Ana";',v:'Antes de asignar, pregúntate: ¿qué tipo de dato es este valor?',s:'Es como guardar sopa en un sobre: cada cosa necesita su recipiente.'},
nul:{n:'Referencia nula (NullPointerException)',q:'La variable vale null y tratas de usar un método de ella.',p:'null significa "no apunta a ningún objeto". Llamar .length() sobre nada es imposible, y Java lanza NullPointerException en ejecución.',e:'String s = "hola";\nif (s != null) System.out.println(s.length());',v:'Inicializa tus objetos y valida con != null antes de usarlos.',s:'Es intentar abrir una caja que no existe.'},
idx:{n:'Índice fuera de límites',q:'Accedes a una posición del arreglo que no existe.',p:'Un arreglo de n elementos tiene índices de 0 a n-1. Pedir el índice n lanza ArrayIndexOutOfBoundsException.',e:'int[] a = new int[3]; // índices 0,1,2\na[2] = 9;  // último válido',v:'Recorre con "i < a.length" (nunca "<=") y recuerda que se cuenta desde 0.',s:'Si tienes 3 sillas numeradas 0,1,2, la silla 3 no existe.'},
ini:{n:'Variable no inicializada',q:'Usas una variable local que nunca recibió valor.',p:'Java no asigna valores por defecto a variables locales; el compilador te obliga a darles uno antes de leerlas.',e:'int total = 0;\ntotal = total + 5;',v:'Declara y asigna en la misma línea siempre que puedas.',s:'Es usar una caja vacía como si tuviera algo dentro.'},
llav:{n:'Llaves desbalanceadas',q:'La cantidad de "{" no coincide con la de "}".',p:'Cada bloque (clase, método, if, for) se abre y se cierra. Si falta una llave, el compilador llega al final del archivo sin entender dónde terminó el bloque.',e:'if (x > 0) {\n  y = 1;\n}  // cierre',v:'Escribe la llave de cierre apenas abres la de apertura y usa indentación consistente.',s:'Son paréntesis de bloques: cada apertura necesita su cierre.'},
kw:{n:'Palabra clave mal escrita',q:'El comando inicial no es una instrucción SQL válida.',p:'El motor SQL reconoce palabras reservadas exactas (SELECT, INSERT, UPDATE...). Una letra incorrecta provoca error de sintaxis.',e:'SELECT nombre FROM alumnos;',v:'Escribe las palabras reservadas en MAYÚSCULAS para notar rápido si están bien.',s:'Es como escribir mal el nombre de un comando: la base de datos no lo entiende.'},
from:{n:'Falta FROM',q:'El SELECT no indica de qué tabla sacar los datos.',p:'SELECT elige columnas, pero FROM dice dónde están. Sin tabla no hay datos que leer.',e:'SELECT nombre, edad FROM alumnos;',v:'Piensa en la plantilla SELECT columnas FROM tabla WHERE condición.',s:'Pides cosas pero no dices en qué estante buscarlas.'},
coma:{n:'Coma sobrante antes de FROM',q:'Hay una coma después de la última columna.',p:'La coma separa columnas; si no hay otra después, el motor espera una columna más y encuentra FROM.',e:'SELECT nombre, edad FROM alumnos;',v:'La última columna nunca lleva coma.',s:'Sobra una coma: parece que falta otro elemento en la lista.'},
isnull:{n:'Comparación con NULL',q:'Usaste "= NULL" o "<> NULL".',p:'NULL significa "valor desconocido". Cualquier comparación con = da desconocido, nunca verdadero, así que no devuelve filas.',e:'SELECT * FROM alumnos WHERE edad IS NULL;',v:'Para NULL usa siempre IS NULL / IS NOT NULL.',s:'No se puede "igualar" algo desconocido; solo preguntar si es desconocido.'},
comi:{n:'Comillas sin cerrar',q:'Hay un número impar de comillas simples.',p:'Los textos en SQL van entre comillas simples; si una queda abierta, el motor lee el resto como texto.',e:"SELECT * FROM t WHERE nombre = 'Ana';",v:'Escribe ambas comillas y luego el contenido en medio.',s:'Abriste una comilla y nunca la cerraste.'},
par:{n:'Paréntesis desbalanceados',q:'No coinciden los "(" con los ")".',p:'Cada paréntesis abierto necesita su cierre para delimitar subconsultas o listas.',e:'WHERE id IN (1, 2, 3)',v:'Cuenta aperturas y cierres cuando anides condiciones.',s:'Cada ( necesita su ).'},
where:{n:'Sin WHERE (¡peligroso!)',q:'UPDATE o DELETE sin WHERE afecta todas las filas de la tabla.',p:'Sin condición, SQL asume "todas". Así se pierden o modifican datos completos por error.',e:'DELETE FROM clientes WHERE id = 7;',v:'Primero prueba con SELECT usando el mismo WHERE y luego ejecuta el cambio.',s:'Es como decir "borra" sin decir qué.'},
group:{n:'Falta GROUP BY',q:'Mezclas una columna normal con una función de agregado (COUNT, SUM...).',p:'El motor no sabe cómo agrupar: debe saber por qué columna calcular cada resultado.',e:'SELECT carrera, COUNT(*) FROM alumnos GROUP BY carrera;',v:'Toda columna no agregada del SELECT debe ir en GROUP BY.',s:'Contar "por algo" requiere decir por qué.'},
semi:{n:'Falta punto y coma final',q:'La consulta no termina en ";".',p:'Algunos motores lo exigen para saber dónde acaba la instrucción, sobre todo con varias consultas.',e:'SELECT * FROM alumnos;',v:'Acostúmbrate a cerrar cada consulta con ";".',s:'El punto final de la consulta.'}};

// ---------- analizadores ----------
function javaA(code){const L=code.split('\n'),out=[],add=(k,line,fix,cd=true,sev='er')=>out.push({k,line,fix,cd,sev,lang:'Java',bad:line?L[line-1]:''});
 const o=(code.match(/{/g)||[]).length,c=(code.match(/}/g)||[]).length;if(o!==c)add('llav',0,'Revisa que cada { tenga su }',false);
 const decl={},nulls={};let arr=null;
 L.forEach((raw,i)=>{const s=raw.trim(),n=i+1,ind=raw.match(/^\s*/)[0];if(!s||s.startsWith('//'))return;
  let m;if(m=s.match(/^(int|double|float|long|boolean|char|String)\s+(\w+)\s*;/))decl[m[2]]=n;
  if(m=s.match(/^(\w+)\s*=[^=]/))delete decl[m[1]];
  if(m=s.match(/^String\s+(\w+)\s*=\s*null/))nulls[m[1]]=n;
  if(!/[;{}]\s*$/.test(s)&&!/^(if|for|while|else|@|\*|\/\*)/.test(s)&&!/,$/.test(s)&&/[\w\)"\]]$/.test(s))add('sc',n,ind+s+';');
  if(/if\s*\([^=!<>]*[^=!<>]=[^=][^)]*\)/.test(s)&&!/==/.test(s))add('asg',n,ind+s.replace(/([^=!<>])=([^=])/,'$1==$2'));
  if(/\w+\s*==\s*"/.test(s)&&/if|while/.test(s))add('streq',n,ind+s.replace(/(\w+)\s*==\s*("[^"]*")/,'$1.equals($2)'),true,'wa');
  if(/^int\s+\w+\s*=\s*"/.test(s))add('tipo',n,ind+s.replace(/^int/,'String'));
  if(/^String\s+\w+\s*=\s*-?\d+\s*;/.test(s))add('tipo',n,ind+s.replace(/=\s*(-?\d+)/,'= "$1"'));
  if((m=s.match(/(\w+)\s*\.\s*(length|equals|charAt|toUpperCase)\b/))&&nulls[m[1]]&&nulls[m[1]]<n)add('nul',n,ind+'if ('+m[1]+' != null) '+s);
  if((m=s.match(/(\w+)\s*\[\s*(\w+)\.length\s*\]/))&&m[1]===m[2])add('idx',n,ind+s.replace(/\.length\s*\]/,'.length - 1]'));
  if(/for\s*\(.*<=\s*\w+\.length/.test(s))add('idx',n,ind+s.replace('<=','<'));
  if(m=s.match(/new\s+int\s*\[\s*(\d+)\s*\]/))arr=+m[1];

function expand(src){const t=src.replace(/\{/g,' { ').replace(/\}/g,' } ').replace(/\(\)|;/g,' ').split(/\s+/).filter(Boolean);let p=0;

 const seen=new Set(['0,0']),q=[[0,0]];while(q.length){const[x,y]=q.shift();[[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const X=x+a,Y=y+b;if(X>=0&&Y>=0&&X<6&&Y<6&&!seen.has(X+','+Y)&&!w.some(c=>c[0]===X&&c[1]===Y)){seen.add(X+','+Y);q.push([X,Y])}})}

const HN={name:'Nombre',email:'Correo',level:'Nivel',rank:'Rango',xp:'XP',prog_java:'Etapas Java (0-5)',prog_sql:'Etapas SQL (0-5)',prog_python:'Etapas Python (0-5)',juegos_ganados:'Juegos ganados',errores:'Errores analizados',top_error:'Error más frecuente',racha:'Racha (días)',registro:'Fecha de registro',ultima_actividad:'Última actividad'},HK=Object.keys(HN);
function loadAdm(){adm.busy=1;adm.err='';if(adm.sub){try{adm.sub()}catch(e){}adm.sub=null}try{if(!DBS)throw new Error('La base de datos no está disponible en esta vista (¿abriste la página con tu cuenta de Claude?).');
 adm.sub=DBS.collection('registros').onSnapshot(sn=>{adm.rows=sn.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>String(y.ultima_actividad||'').localeCompare(String(x.ultima_actividad||'')));adm.busy=0;adm.err='';adm.at=new Date().toLocaleTimeString();if(tab==='admin')render()},e=>{adm.busy=0;adm.err=(e&&e.message)||'No se pudo leer los registros';if(tab==='admin')render()})}catch(e){adm.busy=0;adm.err=e.message}render()}
function adminV(){if(!adm.sub&&!adm.busy&&!adm.err)setTimeout(loadAdm,0);const R=allRows();
 return `<div class="c hero"><h2>📊 Registros de estudiantes</h2><p class="mu">Panel solo para el dueño de la página. Cada estudiante que se registra y use la página con sesión iniciada aparece aquí con su seguimiento.</p></div><div class="c"><p><button class="p" onclick="loadAdm()">🔄 Reconectar</button> <span class="tag ok">● En vivo${adm.at?' · '+adm.at:''}</span> <button onclick="xlsxDL()">⬇️ Descargar Excel (.xlsx)</button> <button onclick="csvDL()">⬇️ CSV</button> <b>${R.length}</b> estudiante(s)</p>${adm.busy?'<p><span class="spin"></span> Cargando…</p>':''}<p class="mu" style="font-size:13px">Los nuevos registros aparecen solos. Si alguien no sale: debe abrir la página con su cuenta de Claude, iniciar sesión en DebugU y tener permiso de <b>Colaborador</b>. Un registro hecho antes de esta versión aparece cuando esa persona vuelva a entrar.</p><p class="mu" style="font-size:13px">En la nube: <b>${(adm.rows||[]).length}</b> · Importados a mano: <b>${Object.keys(impo()).length}</b></p><div class="bx"><b>📥 Importar registros manualmente</b>Si un estudiante no puede guardar en la nube, pídele su código (Perfil → “Enviar mi registro al docente”) y pégalo aquí, uno por línea.<textarea id="imp" style="min-height:70px" placeholder="DBG1:..."></textarea><button class="p" onclick="impGo()">Importar</button></div>${adm.err?`<p style="color:var(--er)">❌ ${esc(adm.err)}</p>`:''}<div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:13px;width:100%"><tr>${HK.map(h=>`<th align=left style="padding:6px;border-bottom:2px solid var(--bd);white-space:nowrap">${HN[h]}</th>`).join('')}</tr>${R.map(r=>`<tr>${HK.map(h=>`<td style="padding:6px;border-bottom:1px solid var(--bd);white-space:nowrap">${esc(String(r[h]??''))}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${HK.length}" class="mu" style="padding:12px">Aún no hay registros.</td></tr>`}</table></div></div>`}
function xlsxDL(){const R=allRows();if(!R.length)return toast('No hay registros todavía');const data=[HK.map(h=>HN[h]),...R.map(r=>HK.map(h=>r[h]??''))];
 if(window.XLSX){try{const ws=XLSX.utils.aoa_to_sheet(data),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Registros');return dlf('registros-debugu.xlsx',new Uint8Array(XLSX.write(wb,{type:'array',bookType:'xlsx'})))}catch(e){}}csvDL()}
function csvDL(){const R=allRows();if(!R.length)return toast('No hay registros todavía');const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';dlf('registros-debugu.csv','\ufeff'+[HK.map(h=>q(HN[h])).join(','),...R.map(r=>HK.map(h=>q(r[h])).join(','))].join('\n'))}
const _au=auth;auth=function(){_au();if(me)setTimeout(cloudSync,600)};
const _r3=render;render=function(){_r3();if(me){clearTimeout(syncT);syncT=setTimeout(cloudSync,3000)}};

// ---------- registro manual (plan B sin permisos) ----------
const impo=()=>st.get('du_imp')||{};
function allRows(){const m={};(adm.rows||[]).forEach(r=>m[String(r.email||r.id).toLowerCase()]=r);Object.values(impo()).forEach(r=>{const k=r.email.toLowerCase();if(!m[k]||String(r.ultima_actividad||'')>String(m[k].ultima_actividad||''))m[k]={...r,id:'imp'}});return Object.values(m).sort((a,b)=>String(b.ultima_actividad||'').localeCompare(String(a.ultima_actividad||'')))}
function impGo(){const t=($('#imp').value||'').split(/\s+/).filter(x=>x.startsWith('DBG1:'));let n=0;const o=impo();t.forEach(c=>{try{const d=JSON.parse(decodeURIComponent(escape(atob(c.slice(5)))));if(d.email&&d.name){o[d.email.toLowerCase()]=d;n++}}catch(e){}});st.set('du_imp',o);toast(n?('📥 '+n+' registro(s) importado(s)'):'No encontré códigos válidos (deben empezar con DBG1:)');render()}
function myReg(){const d={name:me.name,email:me.email,level:me.level,rank:rank(me.xp),xp:me.xp,prog_java:me.prog.Java||0,prog_sql:me.prog.SQL||0,prog_python:me.prog.Python||0,juegos_ganados:me.gw||0,errores:me.hist.length,top_error:topErr(),racha:me.str||0,registro:me.created||'',ultima_actividad:new Date().toISOString()};return d}
const myCode=()=>'DBG1:'+btoa(unescape(encodeURIComponent(JSON.stringify(myReg()))));
function copyCode(){const t=$('#rcode');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}toast(ok?'📋 Código copiado: envíaselo al docente':'Selecciona el código y cópialo manualmente')}
function dlReg(){dlf('mi-registro-debugu.txt',myCode())}
const _pv=profV;profV=function(){return _pv()+`<div class="c"><h3>📨 Enviar mi registro al docente</h3><p>Estado en la nube: ${syncIc()} <span class="mu">${syncTip()}</span></p><p class="mu">Si el ícono muestra ⚠️, envía este código a tu docente por WhatsApp o correo: él lo importa a su Excel.</p><textarea id="rcode" readonly style="min-height:70px">${myCode()}</textarea><p><button class="p" onclick="copyCode()">📋 Copiar código</button> <button onclick="dlReg()">⬇️ Descargar archivo</button></p></div>`};
Object.values(users).forEach(fixUser);render();initCloud();if(me&&me.dd!==today())setTimeout(()=>toast('🔔 Tu código roto del día te está esperando'),1500);
